<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dress Finder - Pakistani Fashion</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-gem"></i> DressFinder
        </div>
        <!-- <p class="subtitle">Find the perfect outfit within your budget.</p> -->
    </header>

    <main class="container">
        <aside class="sidebar">
            <div class="filter-card">
                <h3><i class="fas fa-filter"></i> Filters</h3>
                <div class="filter-group">
                    <label>Search Query</label>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="e.g. embroidered lawn...">
                    </div>
                </div>

                <div class="filter-group">
                    <label>Max Budget (PKR)</label>
                    <div class="price-input">
                        <input type="number" id="maxPriceInput" placeholder="e.g. 5000">
                    </div>
                </div>

                <div class="filter-group">
                    <label>Brand</label>
                    <select id="brandSelect">
                        <option value="">All Brands</option>
                        <option value="Alkaram Studio">Alkaram Studio</option>
                        <option value="Nishat Linen">Nishat Linen</option>
                        <option value="Sapphire">Sapphire</option>
                    </select>
                </div>

                <div class="filter-group checkbox-group">
                    <label class="toggle-switch">
                        <input type="checkbox" id="saleCheck">
                        <span class="slider"></span>
                    </label>
                    <span>Only On Sale</span>
                </div>
                
                <div class="filter-group">
                    <label>Sort By</label>
                    <select id="sortSelect">
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                    </select>
                </div>

                <button id="searchBtn" class="primary-btn">Apply Filters</button>
            </div>
        </aside>

        <section class="results-section">
            <div class="results-header">
                <h2 id="resultsCount">Loading products...</h2>
            </div>
            
            <div id="loader" class="loader-container">
                <div class="spinner"></div>
            </div>

            <div id="productsGrid" class="products-grid">
                <!-- Product cards will be injected here via JS -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
